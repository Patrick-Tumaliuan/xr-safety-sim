<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner testing</title>
    <style>
        html, body { margin:0; height: 100%; }
        #renderCanvas { margin: 0; height: 100%; background-color: black;}
        #hiddenCanvas { margin: 0; height: 100%; display: none;}
        
        #enterARBtn {
            padding: 10px 20px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #enterARBtn:hover {
            background: #0063cc;
        }

    </style>
</head>
<body>
    <canvas id = "renderCanvas"> </canvas>
    <canvas id = "hiddenCanvas"></canvas>
    <script type = "module" src = "./src/mainscript.js"></script>
    <!-- Popup Background -->
    <div id="popupOverlay" class="overlay hidden">
        <div class="popup">
            <h2>Ready to Enter AR?</h2>
            <p>Tap the button below to continue.</p>
            <button id="enterARBtn">Enter AR</button>
     </div>
</div>
</body>
</html>
