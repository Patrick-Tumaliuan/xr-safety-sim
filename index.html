<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>QR → XR</title>
  //<!-- WebXR polyfill for browsers without native WebXR (e.g., iOS Safari) -->
//<script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00ffe0;
      --bg: #0a0a0f;
      --text: #e8eaf0;
      --panel-bg: rgba(10, 10, 20, 0.82);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
   
    #camera-feed {           /* 1 — live camera video */
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #qr-canvas {             /* 2 — hidden; used only for jsQR pixel grab */
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    #babylon-canvas {        /* 3 — Babylon renders on top */
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 3;
      background: transparent;
      touch-action: none;
    }


    #scan-overlay {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #scan-overlay.hidden { opacity: 0; pointer-events: none; }

    .scan-frame {
      width: min(72vw, 320px);
      aspect-ratio: 1;
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.45), 0 0 30px var(--accent);
      position: relative;
    }
    .scan-frame::before, .scan-frame::after,
    .scan-frame > span::before, .scan-frame > span::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-color: var(--accent);
      border-style: solid;
    }
    .scan-frame::before  { top: -2px;  left: -2px;  border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
    .scan-frame::after   { top: -2px;  right: -2px; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
    .scan-frame > span::before { bottom: -2px; left: -2px;  border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
    .scan-frame > span::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }

    .scan-line {
      position: absolute; top: 0; left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan-sweep 1.8s ease-in-out infinite;
    }
    @keyframes scan-sweep {
      0%   { top: 4px; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 6px); opacity: 0; }
    }

    #scan-label {
      margin-top: 22px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
    }

    /*Status banner*/
    #status {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      background: var(--panel-bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 7px 20px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      transition: opacity 0.4s;
      white-space: nowrap;
    }

    /*XR button */
    #xr-btn {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: none;
      padding: 13px 32px;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #xr-btn:active { transform: translateX(-50%) scale(0.96); box-shadow: 0 0 8px var(--accent); }
  </style>
</head>
<body>

 
  <video id="camera-feed" autoplay playsinline muted></video>


  <canvas id="qr-canvas"></canvas>

  <canvas id="babylon-canvas"></canvas>

 
  <div id="scan-overlay">
    <div class="scan-frame">
      <span></span>
      <div class="scan-line"></div>
    </div>
    <p id="scan-label">Point at a QR code</p>
  </div>

 
  <div id="status">Initializing camera…</div>

  
  <button id="xr-btn">⬡ Enter Immersive XR</button>

  
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>


  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

 
  <script type="module" src="/src/app.js"></script>
</body>
</html>
