<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner testing</title>
    <style>
        html, body { margin:0; height: 100%; }
        #renderCanvas { margin: 0; height: 100%; background-color: black;}
        #hiddenCanvas { margin: 0; height: 100%; display: none;}
        
        #enterARBtn {
            padding: 10px 20px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #enterARBtn:hover {
            background: #0063cc;
        }

        
        .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(3px);
        z-index: 9999;
        }

        .popup {
        background: white;
        padding: 20px 30px;
        border-radius: 10px;
        text-align: center;
        width: 280px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }


        .hidden{
            display: none;
        }

    </style>
</head>
<body>
    <canvas id = "renderCanvas"> </canvas>
    <canvas id = "hiddenCanvas"></canvas>
    <script type = "module" src = "./src/mainscript.js"></script>
    <!-- Popup Background -->
    <div id="popupOverlay" class="overlay hidden">
        <div class="popup">
            <h2>Ready to Enter AR?</h2>
            <p>Tap the button below to continue.</p>
            <button id="enterARBtn">Enter AR</button>
     </div>
</div>
</body>
</html>
