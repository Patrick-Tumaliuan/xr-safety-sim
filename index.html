<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner testing</title>
    <style>
        html, body { overflow: 0; margin:0; height: 100%; width: 100%;; background-color: grey; position: relative;}
        #babylonCanvas {position: absolute;width: 100%; height: 100%;}
        #webCanvas {position: absolute;width: 100%; height: 100%;}
        #qrCanvas {position: absolute;width: 100%; height: 100%; background-color: red;}
        .hidden{
            display: none;
        }
        .button {
            position: absolute; 
            background-color: white;
            border: 2, solid, black;
            border-radius: 5px;
            color: black;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
        .button:hover{background-color: aqua;}
        .button:active{background-color: aquamarine;}
        #toggleScene-btn {
            bottom: 20px;
            left: 50%;
        }
    </style>
</head>
<body>
    <canvas id = "babylonCanvas"> </canvas>
    <canvas id = "webCanvas" class="hidden"></canvas>
    <canvas id = "qrCanvas" class="hidden"></canvas>
    <button id = "toggleScene-btn" class = "button"> Toggle View </button>
    <script type = "module" src = "./src/mainscript.js"></script>
</body>
</html>
